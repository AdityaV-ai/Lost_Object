<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Report a lost item — FindBack</title><link rel="stylesheet" href="assets/styles.css"></head><body><div id="app-header"></div><main class="page-wrap"><div class="page-intro"><span class="eyebrow">Tell us what happened</span><h1>Report a lost item</h1><p>Share what you remember. You can leave optional details blank and update the team if you recall more later.</p></div><form id="lost-form" class="form-card"><div class="form-grid"><label>Item name <span class="required">*</span><input name="item_name" required placeholder="e.g. Black wireless headphones"></label><label>Category <span class="required">*</span><select name="category" required><option value="">Choose a category</option><option>Electronics</option><option>Accessories</option><option>Clothing</option><option>Books & stationery</option><option>Keys & cards</option><option>Bags</option><option>Other</option></select></label><label>Colour<input name="colour" placeholder="e.g. Navy blue"></label><label>Brand / manufacturer<input name="brand" placeholder="If known"></label><label>Model<input name="model" placeholder="If known"></label><label>Last-seen location<input name="location" placeholder="Building, room or campus area"></label><label class="full">Distinguishing features<textarea name="distinguishing_features" rows="3" placeholder="Stickers, scratches, initials or other unique details"></textarea></label><label class="full">Additional description<textarea name="description" rows="4" placeholder="Anything else that may help identify your item"></textarea></label><label class="full">Photo (optional)<input type="file" name="image" accept=".jpg,.jpeg,.png,image/jpeg,image/png"><small class="hint">JPG or PNG. Only upload an image you are comfortable sharing with authorised staff.</small><img class="preview hidden" id="lost-preview" alt="Selected image preview"></label></div><div class="form-message" role="status"></div><div class="form-footer"><a class="text-link" href="dashboard.html">Cancel</a><button class="btn btn-primary" type="submit">Submit lost report →</button></div></form></main><script src="js/config.js"></script><script src="js/api.js"></script><script src="js/common.js"></script><script src="js/reports.js"></script></body></html>
